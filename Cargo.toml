[package]
name = "atuin-export"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
strip = true
